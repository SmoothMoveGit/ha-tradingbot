configuration:
  alpaca_api_key:
    name: Alpaca API Key ID
    description: Aus dem Alpaca-Dashboard (Paper Trading -> API Keys).
  alpaca_secret_key:
    name: Alpaca Secret Key
    description: Wird bei Alpaca nur einmal angezeigt.
  mode:
    name: Modus
    description: "paper = Spielgeld (empfohlen), sim = offline mit Zufallskursen, live = ECHTES GELD."
  start_budget:
    name: Startbudget (USD)
    description: So viel Geld darf der Bot einsetzen. Gewinne kommen dazu, Verluste gehen ab.
  monthly_deposit:
    name: Monatliche Einzahlung (USD)
    description: Wird jeden Monat zum Kapital addiert (auch im Backtest). 0 = keine.
  extra_deposit:
    name: Sonderzahlungen gesamt (USD)
    description: Summe aller Einmalzahlungen. Erhöhst du den Wert, wird die Differenz einmal zum Kapital gebucht (der ETF-Vergleich kauft zum selben Tag nach).
  day_alpaca_api_key:
    name: Daytrader Alpaca API Key ID
    description: Zweites Alpaca-Paper-Konto für den Vergleichs-Bot (Daytrading). Leer = kein Daytrader.
  day_alpaca_secret_key:
    name: Daytrader Alpaca Secret Key
  day_budget:
    name: Daytrader Startbudget (USD)
    description: Spielgeld für den Daytrader. Leer = 1100.
  day_extra_deposit:
    name: Daytrader Sonderzahlungen gesamt (USD)
    description: Summe aller Einmalzahlungen für den Daytrader. Erhöht das Kapital, zählt aber nicht als Gewinn.
  strategy:
    name: Strategie
    description: "standard = kurzer Trend, enge Stops. trendfolger = langer Trend 50/200, Stops 15 %. aggressiv = wie trendfolger, aber 4 große Positionen, keine Reserve, Not-Aus erst bei 50 % Verlust. momentum = monatlich die 4 Aktien mit der besten 12-Monats-Rendite, je 25 %, keine Stops."
  notify_service:
    name: Benachrichtigungsdienst
    description: "z.B. notify.mobile_app_dein_handy. Leer = Benachrichtigung in Home Assistant."
  sec_user_agent:
    name: SEC-Kontakt (Name und E-Mail)
    description: "z.B. Max Muster max@example.com. Die SEC verlangt das für den Abruf der Pflichtmeldungen (8-K). Leer = keine SEC-Meldungen."
  anthropic_api_key:
    name: Anthropic API Key (optional)
    description: Bessere Nachrichtenbewertung mit Claude. Leer = lokale Bewertung.
  live_confirmation:
    name: Bestätigung Live-Handel
    description: "Nur für Modus live: exakt ja-ich-kenne-das-risiko eintragen."
