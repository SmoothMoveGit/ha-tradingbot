configuration:
  alpaca_api_key:
    name: Alpaca API Key ID
  alpaca_secret_key:
    name: Alpaca Secret Key
  mode:
    name: Mode
    description: "paper = simulated money (recommended), sim = offline, live = REAL MONEY."
  start_budget:
    name: Start budget (USD)
  monthly_deposit:
    name: Monthly deposit (USD)
    description: Added to the capital every month (also in the backtest). 0 = none.
  extra_deposit:
    name: One-off deposits total (USD)
    description: Sum of all one-off deposits. Raising it books the difference once.
  day_alpaca_api_key:
    name: Day trader Alpaca API key ID
    description: Second Alpaca paper account for the comparison bot. Empty = no day trader.
  day_alpaca_secret_key:
    name: Day trader Alpaca secret key
  day_budget:
    name: Day trader start budget (USD)
  day_extra_deposit:
    name: Day trader one-off deposits total (USD)
    description: Sum of all one-off deposits for the day trader. Raises the capital, not counted as profit.
  strategy:
    name: Strategy
    description: "standard = short trend, tight stops. trendfolger = long trend 50/200, 15 % stops. aggressiv = like trendfolger, but 4 large positions, no cash reserve, emergency stop at 50 % loss."
  notify_service:
    name: Notify service
    description: "e.g. notify.mobile_app_phone. Empty = persistent notification."
  sec_user_agent:
    name: SEC contact (name and email)
    description: "e.g. Jane Doe jane@example.com. Required by the SEC to read 8-K filings. Empty = no SEC filings."
  anthropic_api_key:
    name: Anthropic API key (optional)
  live_confirmation:
    name: Live trading confirmation
    description: "Live mode only: enter exactly ja-ich-kenne-das-risiko."
