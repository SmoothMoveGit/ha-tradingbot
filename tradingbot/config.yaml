name: Tradingbot
version: "0.7.5"
slug: tradingbot
description: Autonomer Aktien-Tradingbot mit Nachrichtenanalyse (startet im Paper-Modus)
url: https://github.com/SmoothMoveGit/ha-tradingbot
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - app_config:rw
options:
  alpaca_api_key: ""
  alpaca_secret_key: ""
  mode: paper
  start_budget: 300
  monthly_deposit: 0
  strategy: standard
schema:
  alpaca_api_key: password
  alpaca_secret_key: password
  mode: list(paper|live|sim)
  start_budget: float(10,)
  monthly_deposit: float(0,)
  extra_deposit: float(0,)?
  strategy: list(standard|trendfolger|aggressiv)
  notify_service: str?
  anthropic_api_key: password?
  live_confirmation: str?
  day_alpaca_api_key: password?
  day_alpaca_secret_key: password?
  day_budget: float(10,)?
